name: Truth Social Monitor

# 正式 24/7 監控就是這支（路 A，見 docs/PING_SETUP.md）：
#  - 不用 `schedule:` cron —— 它是 best-effort，會被延遲數小時、堆積觸發被合併，
#    「每 5 分」會跑成「每幾小時、一次吐一批」。
#  - 改由 cron-job.org 每 1 分鐘打 GitHub API 觸發 `workflow_dispatch`（不被節流）。
#  - 每次跑 RUN_ONCE=1（只跑一輪不進迴圈）；concurrency 防重疊。
on:
  workflow_dispatch:

# 防重疊：同時只跑一個。1 分鐘間隔下，若上一個還沒跑完，新觸發會排隊（不取消進行中的，
# 避免發到一半被砍 → 漏發/重發/seen.json 沒 push）。GitHub 每個 group 最多保留 1 個 pending，
# 所以最多「1 個跑 + 1 個等」，不會塞爆。
concurrency:
  group: truth-social-monitor
  cancel-in-progress: false

# 允許 workflow 把 seen.json 推回 repo（手動測試時保留去重狀態）
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: 跑監控程式（單次）
        env:
          RUN_ONCE: "1"          # 只跑一輪就結束，不進常駐迴圈
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: 把 seen.json 變更推回 repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen ids"
          git push
